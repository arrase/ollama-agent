[build-system]
requires = ["setuptools>=84.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ollama-agent"
version = "0.8.9"
description = "AI agent to interact with local language models through Ollama"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "deepagents>=0.7.7",
    "langchain>=1.3.15",
    "langchain-core>=1.5.6",
    "langchain-ollama>=1.1.0",
    "langgraph>=1.2.11",
    "langgraph-checkpoint-sqlite>=3.1.1",
    "aiosqlite>=0.22.1",
    "langchain-mcp-adapters>=0.3.2",
    "PyYAML>=6.0.3",
    "ollama>=0.6.2",
    "textual>=8.2.8",
    "qdrant-client>=1.19.0",
    "rich>=15.0.0",
]

[project.scripts]
ollama-agent = "ollama_agent.main:main"

[project.optional-dependencies]
dev = ["ruff>=0.9"]

[tool.setuptools.packages.find]
where = ["."]
include = ["ollama_agent*"]

[tool.setuptools.package-data]
ollama_agent = ["settings/prompts/*.md", "interfaces/*.css", "i18n/locales/*.json"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

