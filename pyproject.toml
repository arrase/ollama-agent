[build-system]
requires = ["setuptools>=83.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ollama-agent"
version = "0.6.4"
description = "AI agent to interact with local language models through Ollama"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "deepagents>=0.7.4",
    "langchain>=1.3.14",
    "langchain-core>=1.5.3",
    "langchain-ollama>=1.1.0",
    "langgraph>=1.2.10",
    "langgraph-checkpoint-sqlite>=3.1.1",
    "aiosqlite>=0.22.1",
    "langchain-mcp-adapters>=0.3.1",
    "PyYAML>=6.0.3",
    "ollama>=0.6.2",
    "textual>=8.2.8",
    "qdrant-client>=1.19.0",
    "rich>=15.0.0",
    "mcp>=1.24.0,<2.0.0",
]

[project.scripts]
ollama-agent = "ollama_agent.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["ollama_agent*"]

[tool.setuptools.package-data]
ollama_agent = ["settings/prompts/*.md", "interfaces/*.css"]
