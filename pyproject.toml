[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ollama-agent"
version = "0.2.6"
description = "Agente de IA para interactuar con modelos de lenguaje locales a través de Ollama"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "deepagents==0.4.7",
    "langchain==1.2.10",
    "langchain-openai==1.1.10",
    "langgraph==1.0.10",
    "langchain-mcp-adapters==0.2.1",
    "PyYAML==6.0.3",
    "openai==2.26.0",
    "ollama==0.6.1",
    "mem0ai==1.0.5",
    "mcp==1.21.2",
    "mss==10.1.0",
    "Pillow==12.1.1",
    "prompt_toolkit==3.0.52",
    "qdrant-client==1.17.0",
    "rich==14.3.3",
]

[project.scripts]
ollama-agent = "ollama_agent.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["ollama_agent*"]

[tool.setuptools.package-data]
ollama_agent = ["settings/default_instructions.md"]
