[build-system]
requires = ["setuptools>=84.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ollama-agent"
version = "0.10.8"
description = "AI agent to interact with local language models through Ollama"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "deepagents==0.7.14",
    "langchain==1.4.2",
    "langchain-core==1.6.3",
    "langchain-ollama==1.1.0",
    "langgraph==1.2.11",
    "langgraph-checkpoint-sqlite==3.1.1",
    "aiosqlite==0.22.1",
    "langchain-mcp-adapters==0.3.2",
    "langchain-text-splitters==1.1.2",
    "PyYAML==6.0.3",
    "ollama==0.6.2",
    "textual==8.2.8",
    "qdrant-client==1.19.1",
    "rich==15.0.0",
    "jinja2==3.1.6",
    "httpx>=0.28.0",
    "packaging>=26.3",
]

[project.scripts]
ollama-agent = "ollama_agent.main:main"

[project.optional-dependencies]
dev = [
    "ruff==0.16.7",
    "mypy>=2.3.1",
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
]
test = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
]
docs = ["mkdocs-material>=9.7.7"]

[tool.setuptools.packages.find]
where = ["."]
include = ["ollama_agent*"]

[tool.setuptools.package-data]
ollama_agent = [
    "settings/prompts/*.md",
    "interfaces/*.tcss",
    "interfaces/*.css",
    "interfaces/**/*.tcss",
    "interfaces/**/*.css",
    "i18n/locales/*.json",
    "skills/builtin/**",
]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.coverage.run]
source = ["ollama_agent"]
relative_files = true

[tool.coverage.report]
show_missing = true

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
show_error_codes = true
show_column_numbers = true

