[build-system]
requires = ["setuptools>=84.2.1", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ollama-agent"
version = "1.0.2"
description = "AI agent to interact with local language models through Ollama"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "deepagents==0.7.32",
    "langchain==1.4.7",
    "langchain-core==1.7.0",
    "langchain-ollama==1.1.0",
    "langgraph==1.2.18",
    "langgraph-checkpoint-sqlite==3.1.2",
    "aiosqlite==0.22.1",
    "langchain-mcp-adapters==0.3.2",
    "langchain-text-splitters==1.1.3",
    "PyYAML==6.0.3",
    "ollama==0.6.3",
    "textual==8.2.8",
    "qdrant-client==1.20.0",
    "rich==15.0.0",
    "jinja2==3.1.6",
    "httpx>=0.28.1",
    "mcp>=1.30.0,<2.0.0",
    "packaging>=26.3",
    "pydantic>=2.14.1",
]

[project.scripts]
ollama-agent = "ollama_agent.main:main"

[project.optional-dependencies]
test = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
]
dev = [
    "ollama-agent[test]",
    "ruff==0.17.2",
    "mypy>=2.4.0",
]
docs = ["mkdocs-material>=9.8.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["ollama_agent*"]

[tool.setuptools.package-data]
ollama_agent = [
    "interfaces/tui/*.tcss",
    "settings/prompts/*.md",
    "skills/builtin/**/*.md",
    "i18n/locales/*.json",
]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "N", "A", "B", "C4", "S", "UP", "SIM", "RUF", "PTH", "PIE",
    "RET", "PERF", "ASYNC", "LOG", "G", "T20", "PL",
    "C90", "BLE", "TRY", "RSE", "ARG", "ERA", "FIX", "TD", "FURB", "PGH", "SLF",
    "FBT", "DTZ", "PT", "ANN",
]
ignore = [
    # Module-level runtime state (locale, tool defaults, stdio patch depth) is intentional.
    "PLW0603",
    # Cheap path metadata calls (resolve/exists) in async handlers are not worth offloading to threads.
    "ASYNC240",
    # Descriptive messages in standard exceptions are idiomatic without custom exception subclasses.
    "TRY003",
    # ValueError is the uniform domain validation error for persisted YAML and config payloads.
    "TRY004",
]
allowed-confusables = ["❯", "–", "ı"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
max-args = 11
max-positional-args = 5

[tool.ruff.lint.flake8-annotations]
allow-star-arg-any = true

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "SLF001", "PLR2004", "PT011"]
# TUI submodules share package-internal _-prefixed state and cross-reference OllamaAgentApp/OllamaREPL.
"ollama_agent/interfaces/tui/**" = ["SLF001", "ANN401"]
# Optional no-op hooks that subclasses may override.
"ollama_agent/streaming/base.py" = ["B027"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.coverage.run]
source = ["ollama_agent"]
relative_files = true

[tool.coverage.report]
show_missing = true

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
ignore_missing_imports = true
show_error_codes = true
show_column_numbers = true

