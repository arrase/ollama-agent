[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ollama-agent"
version = "0.1.0"
description = "Agente de IA para interactuar con modelos de lenguaje locales a través de Ollama"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "deepagents",
    "langchain",
    "langgraph",
    "langchain-ollama",
    "langchain-mcp-adapters",
    "PyYAML",
    "ollama",
    "mem0ai",
    "mss",
    "Pillow",
    "prompt_toolkit",
    "qdrant-client",
    "rich",
]

[project.scripts]
ollama-agent = "ollama_agent.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["ollama_agent*"]

[tool.setuptools.package-data]
ollama_agent = ["settings/default_instructions.md"]
