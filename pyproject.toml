[build-system]
requires = ["setuptools>=84.2.1", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ollama-agent"
version = "1.0.2"
description = "AI agent to interact with local language models through Ollama"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "deepagents==0.7.29",
    "langchain==1.4.6",
    "langchain-core==1.6.12",
    "langchain-ollama==1.1.0",
    "langgraph==1.2.16",
    "langgraph-checkpoint-sqlite==3.1.2",
    "aiosqlite==0.22.1",
    "langchain-mcp-adapters==0.3.2",
    "langchain-text-splitters==1.1.3",
    "PyYAML==6.0.3",
    "ollama==0.6.3",
    "textual==8.2.8",
    "qdrant-client==1.19.1",
    "rich==15.0.0",
    "jinja2==3.1.6",
    "httpx>=0.28.1",
    "mcp>=1.0.0",
    "packaging>=26.3",
    "pydantic>=2.14.1",
]

[project.scripts]
ollama-agent = "ollama_agent.main:main"

[project.optional-dependencies]
test = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
]
dev = [
    "ollama-agent[test]",
    "ruff==0.17.1",
    "mypy>=2.4.0",
]
docs = ["mkdocs-material>=9.7.7"]

[tool.setuptools.packages.find]
where = ["."]
include = ["ollama_agent*"]

[tool.setuptools.package-data]
ollama_agent = [
    "interfaces/tui/*.tcss",
    "settings/prompts/*.md",
    "skills/builtin/**/*.md",
    "i18n/locales/*.json",
]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "N", "A", "B", "C4", "S", "UP", "SIM", "RUF", "PTH", "PIE",
    "RET", "PERF", "ASYNC", "LOG", "G", "T20", "PL",
]
ignore = [
    # Design-metric rules: thresholds are arbitrary and would force artificial splits.
    "PLR0911", "PLR0913", "PLR0915", "PLR0917", "PLR2004",
    # Module-level runtime state (locale, tool defaults, stdio patch depth) is intentional.
    "PLW0603",
    # Cheap path metadata calls (resolve/exists) in async handlers are not worth offloading to threads.
    "ASYNC240",
]
allowed-confusables = ["❯", "–", "ı"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
# Optional no-op hooks that subclasses may override.
"ollama_agent/streaming/base.py" = ["B027"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.coverage.run]
source = ["ollama_agent"]
relative_files = true

[tool.coverage.report]
show_missing = true

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
show_error_codes = true
show_column_numbers = true

