name: SonarQube Cloud Analysis

on:
  push:
    branches:
      - main
      - master
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  sonarcloud:
    name: SonarQube Cloud Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[test,dev]

      - name: Run Ruff
        run: |
          ruff check . --output-format json --output-file ruff-report.json --exit-zero

      - name: Run Mypy
        run: |
          mypy ollama_agent/ --show-column-numbers --show-error-codes --ignore-missing-imports > mypy-report.txt || true

      - name: Run tests with coverage
        run: |
          pytest --cov=ollama_agent --cov-report=xml:coverage.xml --cov-report=term

      - name: SonarQube Cloud Scan
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
